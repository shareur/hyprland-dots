# >>> ubuntu-bootstrap tmux managed block >>>
# Keep the default prefix: Ctrl+b.
set -g prefix C-b
unbind C-a

# Make tmux more responsive in modern terminals.
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g display-time 3000
set -g status-interval 5

# Better terminal capability handling for common modern terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-overrides ",*:Tc"

# Mouse support: select panes, resize panes, scroll copy-mode history.
set -g mouse on

# Friendly window and pane behavior.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g detach-on-destroy off
setw -g automatic-rename on

# Vi-style copy mode with system clipboard integration when available.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; fi'"

# More convenient pane splits. Keep the current working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-like pane movement while keeping Ctrl+b as the prefix.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with repeated prefix + H/J/K/L.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 5

# Fast config reload.
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Start windows and panes in the current path for new-window too.
bind-key c new-window -c "#{pane_current_path}"
# <<< ubuntu-bootstrap tmux managed block <<<
